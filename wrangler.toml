name = "platform"
main = "src/worker.js"
compatibility_date = "2026-08-24"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "psych-platform"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

[vars]
APP_NAME = "你的心理探索空间"
