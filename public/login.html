<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>验证码登录</title><link rel="stylesheet" href="/style.css"></head><body><main class="shell narrow"><a class="back" href="/">← 返回首页</a><div class="eyebrow">ACCESS CODE</div><h1>进入你的测试空间</h1><p class="lead small">请输入购买后收到的 8 位验证码。</p><form id="form" class="panel"><label>验证码</label><input id="code" autocomplete="one-time-code" placeholder="例如 Q7XM-4KPN" maxlength="9" required><button class="btn" type="submit">验证并进入</button><div id="msg" class="message"></div></form><div class="info"><b>授权规则</b><br>首次验证后 48 小时内有效；同一验证码最多绑定 5 台浏览器设备。</div></main><script src="/login.js"></script></body></html>
