<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理后台</title><link rel="stylesheet" href="/style.css"></head><body><main class="shell"><div class="eyebrow">ADMIN</div><h1>验证码管理</h1><div id="loginBox" class="panel"><label>管理员 Token</label><input id="adminToken" type="password" placeholder="输入 ADMIN_TOKEN"><button id="saveToken" class="btn">进入后台</button><div id="adminMsg" class="message"></div></div><section id="adminApp" hidden><div class="admin-actions panel"><div><label>批量生成</label><input id="qty" type="number" min="1" max="50" value="1"></div><div><label>备注</label><input id="note" placeholder="例如：闲鱼订单 0824"></div><button id="generate" class="btn">生成验证码</button></div><div id="created" class="created" hidden></div><div class="table-wrap"><table><thead><tr><th>验证码</th><th>状态</th><th>有效期</th><th>设备</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script src="/admin.js"></script></body></html>
